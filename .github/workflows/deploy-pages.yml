name: Update Prices & Deploy GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**.txt"
      - "**.md"
  schedule:
    # Refresh suite & stateroom prices every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  prepare-catalogs:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch fresh baseline Staterooms & Suites catalogs
        run: |
          pip install curl_cffi
          python fetch_staterooms.py
          python tracker.py -p FLL,MIA,PCN,TPA,GAL,BYE,SJU,MSY,BWI,LAX --output data/suites.json

      - name: Upload baseline catalogs
        uses: actions/upload-artifact@v4
        with:
          name: baseline-catalogs
          path: |
            data/suites.json
            data/staterooms.json
          retention-days: 1

  enrich-suite-shards:
    needs: prepare-catalogs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download baseline catalogs
        uses: actions/download-artifact@v4
        with:
          name: baseline-catalogs
          path: data

      - name: Enrich suite & stateroom shard ${{ matrix.shard }} of 6
        run: |
          pip install curl_cffi
          python enrich_subtypes.py \
            --json data/suites.json \
            --staterooms-json data/staterooms.json \
            --ship-class all \
            --shard-index ${{ matrix.shard }} \
            --shard-count 6 \
            --workers 5 \
            --force \
            --output-shard shards/shard-${{ matrix.shard }}.json \
            --output-stateroom-shard shards/stateroom-shard-${{ matrix.shard }}.json

      - name: Upload enriched shard ${{ matrix.shard }}
        uses: actions/upload-artifact@v4
        with:
          name: catalog-shard-${{ matrix.shard }}
          path: |
            shards/shard-${{ matrix.shard }}.json
            shards/stateroom-shard-${{ matrix.shard }}.json
          retention-days: 1

  merge-and-deploy:
    needs: [prepare-catalogs, enrich-suite-shards]
    if: always() && (needs.prepare-catalogs.result == 'success' || needs.prepare-catalogs.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.prepare-catalogs.result == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download baseline catalogs
        if: needs.prepare-catalogs.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: baseline-catalogs
          path: data

      - name: Download all enriched shards
        if: needs.prepare-catalogs.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: catalog-shard-*
          path: shards
          merge-multiple: true

      - name: Merge enriched shards into suites.json and staterooms.json
        if: needs.prepare-catalogs.result == 'success'
        run: |
          python enrich_subtypes.py --json data/suites.json --merge-shards "shards/shard-*.json"
          python enrich_subtypes.py --json data/staterooms.json --merge-shards "shards/stateroom-shard-*.json"

      - name: Assemble clean static site bundle with cache-busted asset versions
        run: |
          mkdir -p _site/data
          cp index.html suites.html staterooms.html styles.css app.js robots.txt .nojekyll _site/
          sed -i "s/styles.css?v=[0-9]*/styles.css?v=${{ github.run_number }}/g" _site/*.html
          sed -i "s/app.js?v=[0-9]*/app.js?v=${{ github.run_number }}/g" _site/*.html
          cp data/suites.json data/staterooms.json _site/data/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
